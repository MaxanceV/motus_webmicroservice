spring.application.name=partie-service
server.port=8083

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5434/partie_db
spring.datasource.username=motus
spring.datasource.password=motus
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# URLs des autres services
dictionnaire.service.url=http://localhost:8082
joueur.service.url=http://localhost:8081
