spring.application.name=dictionnaire-service
server.port=8082

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5433/dictionnaire_db
spring.datasource.username=motus
spring.datasource.password=motus
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Charger data.sql au démarrage
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
